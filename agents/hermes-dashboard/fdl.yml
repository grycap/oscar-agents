functions:
  oscar:
  - oscar-cluster:
      name: hermes-dashboard
      cpu: "2.0"
      memory: 2Gi
      image: nousresearch/hermes-agent:v2026.5.7
      script: script.sh
      log_level: INFO
      environment:
        variables:
          HERMES_PORT: "9119"
          HERMES_HOST: "0.0.0.0"
          HERMES_DATA_DIR: /opt/data
          HERMES_DASHBOARD_TUI: "true"
          HERMES_DASHBOARD_INSECURE: "true"
          LLM_PROVIDER_NAME: egi
          OPENAI_BASE_URL: https://llm.ai.egi.eu/v1
          OPENAI_MODEL: agentic
        secrets:
          OPENAI_API_KEY: YOUR_OPENAI_API_KEY
      volume:
        name: hermes-dashboard-volume
        mount_path: /opt/data
      expose:
        min_scale: 1
        max_scale: 1
        api_port: 9119
        cpu_threshold: 90
        rewrite_target: false
        set_auth: true
        auth_type: forward
        health_path: /api/status
        probe_mode: direct
