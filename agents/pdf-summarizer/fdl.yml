functions:
  oscar:
  - oscar-cluster:
      name: pdf-summarizer
      cpu: "1.0"
      memory: 2Gi
      image: ghcr.io/grycap/hermes-agent:v2026.5.29.2
      script: ../../frameworks/hermes/script.sh
      log_level: INFO
      environment:
        variables:
          LLM_PROVIDER_NAME: YOUR_LLM_PROVIDER_NAME
          OPENAI_BASE_URL: YOUR_OPENAI_BASE_URL
          OPENAI_MODEL: YOUR_OPENAI_MODEL
          AGENT_SOUL: |
            {{ file "SOUL.md" }}
          AGENT_SKILLS: |
            {{ agentSkills }}
        secrets:
          OPENAI_API_KEY: YOUR_OPENAI_API_KEY
      input:
      - storage_provider: minio.default
        path: pdf-summarizer/input
      output:
      - storage_provider: minio.default
        path: pdf-summarizer/output
