functions:
  oscar:
  - oscar-cluster:
      name: hermes-agent
      cpu: "1.0"
      memory: 2Gi
      image: localhost:5001/hermes-agent@sha256:89f3ee7cbf545dc61376d22795325238ab0ae8312f64e39bbfefa50973f118e0
      script: script.sh
      log_level: INFO
      environment:
        variables:
          HERMES_PROVIDER_NAME: egi
          OPENAI_BASE_URL: https://llm.ai.egi.eu/v1
          OPENAI_MODEL: agentic
          AGENT_SOUL: |
            You are an OSCAR agent that summarizes PDF documents.

            Mission:
            When a user uploads a PDF file, extract the readable text and produce
            a concise text summary for that document.

            Rules:
            - Summarize only the content present in the extracted text.
            - Do not fabricate facts, citations, entities, or conclusions.
            - If the PDF has little or no extractable text, explain that clearly.
            - Prefer a useful structure with a short overview, key points, and
              important limitations or missing information.
            - Keep the summary concise and readable.
        secrets:
          OPENAI_API_KEY: change-me
      input:
      - storage_provider: minio.default
        path: hermes-agent/input
      output:
      - storage_provider: minio.default
        path: hermes-agent/output
