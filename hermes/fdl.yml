functions:
  oscar:
  - oscar-cluster:
      name: hermes-agent
      cpu: "2.0"
      memory: 4Gi
      image: nousresearch/hermes-agent:v2026.5.7
      script: script.sh
      log_level: INFO
      environment:
        variables:
          HERMES_PORT: "9119"
          HERMES_HOST: "0.0.0.0"
          HERMES_DATA_DIR: /opt/data
          HERMES_DASHBOARD_TUI: "true"
          HERMES_DASHBOARD_INSECURE: "true"
          HERMES_BASE_PATH: /system/services/hermes-agent/exposed
        secrets:
          OPENAI_API_KEY: change-me
      volume:
        name: hermes-agent-volume
        mount_path: /opt/data
      expose:
        min_scale: 1
        max_scale: 1
        api_port: 9119
        cpu_threshold: 90
        rewrite_target: true
        set_auth: true
        health_path: /api/status
        probe_mode: direct
